<!DOCTYPE html>
<html lang="vi">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <link rel="icon" href="./dist/logo-light.png" type="image/png">
  <link rel="apple-touch-icon" href="./dist/logo-light.png">
  <title>🦀 🎂</title>
  <meta name="description" content="Bánh sinh nhật và nến dành cho Crabe.">
  <style>
    html,
    body {
      width: 100%;
      height: 100%;
      margin: 0;
      overflow: hidden;
      background: radial-gradient(ellipse at top, #fff8ef 0%, #f7d8c8 52%, #d7b3a7 100%);
    }

    iframe {
      display: block;
      width: 100%;
      height: 100%;
      border: 0;
      background: transparent;
    }
  </style>
  <script>
    async function loadBirthdayCake() {
      if ('serviceWorker' in navigator) {
        const registrations = await navigator.serviceWorker.getRegistrations()
        await Promise.all(registrations
          .filter(registration => registration.scope.includes('/happy-birthday-friend/crabe/dist/'))
          .map(registration => registration.unregister()))
      }

      if ('caches' in window) {
        const keys = await caches.keys()
        await Promise.all(keys
          .filter(key => key.includes('workbox') || key.includes('precache'))
          .map(key => caches.delete(key)))
      }

      document.querySelector('iframe').src = './dist/?v=crabe-root'
    }
  </script>
</head>
<body onload="loadBirthdayCake()">
  <iframe title="Bánh sinh nhật của Crabe" aria-label="Bánh sinh nhật của Crabe"></iframe>
</body>
</html>
