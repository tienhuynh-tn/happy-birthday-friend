<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Happy Birthday Friend</title>
  <style>
    :root {
      color: #18344a;
      background: #fff7ed;
      font-family: Inter, ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
    }

    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      min-height: 100vh;
      background:
        radial-gradient(circle at top left, rgba(255, 220, 170, 0.8), transparent 32rem),
        linear-gradient(135deg, #fff9f0 0%, #f4fbf7 52%, #f7e5db 100%);
    }

    main {
      width: min(920px, calc(100% - 32px));
      margin: 0 auto;
      padding: 56px 0;
    }

    h1 {
      margin: 0 0 12px;
      font-size: clamp(2rem, 8vw, 4.75rem);
      line-height: 0.95;
    }

    p {
      margin: 0;
      max-width: 620px;
      color: #526274;
      font-size: 1.05rem;
      line-height: 1.6;
    }

    .sites {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(220px, 1fr));
      gap: 14px;
      margin-top: 36px;
    }

    a {
      display: block;
      min-height: 120px;
      padding: 18px;
      border: 1px solid rgba(24, 52, 74, 0.12);
      border-radius: 8px;
      color: inherit;
      background: rgba(255, 255, 255, 0.66);
      text-decoration: none;
      box-shadow: 0 12px 36px rgba(90, 68, 52, 0.08);
    }

    a:focus-visible,
    a:hover {
      border-color: rgba(76, 155, 136, 0.52);
      transform: translateY(-2px);
    }

    strong {
      display: block;
      margin-bottom: 8px;
      font-size: 1.2rem;
    }

    span {
      color: #64748b;
      line-height: 1.4;
    }
  </style>
</head>
<body>
  <main>
    <h1>Happy Birthday Friend</h1>
    <p>A collection of small birthday pages and web gifts.</p>

    <div class="sites" aria-label="Birthday sites">
      <a href="./bao-tram/">
        <strong>Bao Tram</strong>
        <span>Birthday mini-site</span>
      </a>
      <a href="./crabe/">
        <strong>Crabe</strong>
        <span>Cake and candle birthday web</span>
      </a>
      <a href="./nhat-linh/">
        <strong>Nhat Linh</strong>
        <span>Birthday mini-site</span>
      </a>
      <a href="./memory-jar/">
        <strong>Memory Jar</strong>
        <span>Birthday memory page</span>
      </a>
    </div>
  </main>
</body>
</html>
